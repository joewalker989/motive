name: Deploy Motive to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check quotes.js
          node --check daily-quotes.js
          node --check enhancements.js
          node --check companion.js
          node --check wellbeing-core.js
          node --check wellbeing.js
          node --check growth-core.js
          node --check growth.js
          node --check scenes.js
          node --check sw.js
          node --check content-status.js
          node --check update-ready.js
          node --check navigation.js
          node --check home-experience.js
          node --check preferences-core.js
          node --check preferences.js
          node --check discovery-core.js
          node --check discovery.js
          node --check image-studio-core.js
          node --check image-studio.js
          node --check audio-tools-core.js
          node --check audio-tools.js
          node --check calm-tools-core.js
          node --check calm-tools.js
          node --check rest-tools-core.js
          node --check rest-tools.js
          node --check offline-library.js
          node --check practice-tools-core.js
          node --check practice-tools.js
          node --check access-tools-core.js
          node --check access-tools.js
          node --check privacy-tools-core.js
          node --check privacy-tools.js
          node --check backup-preview.js
          node --check media-vault-core.js
          node --check media-vault.js
          node --check guidance-locales.js
          node --check guidance-locale-core.js
          node --check guidance-locale.js
          node --check daily-guidance-locales.js
          node --check story-locales.js
          node --check story-locale-core.js
          node --check story-locale.js
          node --check quote-locales.js
          node --check quote-locale-core.js
          node --check quote-locale.js
          node --check interface-locales.js
          node --check interface-locale.js
          node --check scripts/daily-update.cjs
          node --check scripts/export-quotes.cjs
          node scripts/export-quotes.cjs
          node --test tests/quotes.test.cjs
          node --test tests/widget.test.cjs
          node --test tests/offline.test.cjs
          node --test tests/content-status.test.cjs
          node --test tests/update-ready.test.cjs
          node --test tests/navigation.test.cjs
          node --test tests/preferences.test.cjs
          node --test tests/discovery.test.cjs
          node --test tests/image-studio.test.cjs
          node --test tests/audio-tools.test.cjs
          node --test tests/calm-tools.test.cjs
          node --test tests/rest-tools.test.cjs
          node --test tests/practice-tools.test.cjs
          node --test tests/access-privacy.test.cjs
          node --test tests/media-vault.test.cjs
          node --test tests/guidance-locale.test.cjs
          node --test tests/story-locale.test.cjs
          node --test tests/quote-locale.test.cjs
          node --test tests/interface-locale.test.cjs
          node --test tests/home-experience.test.cjs
          node --test tests/daily-update.test.cjs
          node --test tests/wellbeing.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir public
          cp index.html styles.css app.js quotes.js daily-quotes.js scenes.js enhancements.js companion.js wellbeing-core.js wellbeing.js wellbeing.css growth-core.js growth.js sw.js manifest.webmanifest icon.svg public/
          cp quotes.json content-status.json content-status.js update-ready.js navigation.js home-experience.js preferences-core.js preferences.js discovery-core.js discovery.js image-studio-core.js image-studio.js audio-tools-core.js audio-tools.js calm-tools-core.js calm-tools.js rest-tools-core.js rest-tools.js offline-library.js practice-tools-core.js practice-tools.js access-tools-core.js access-tools.js privacy-tools-core.js privacy-tools.js backup-preview.js media-vault-core.js media-vault.js guidance-locales.js guidance-locale-core.js guidance-locale.js daily-guidance-locales.js story-locales.js story-locale-core.js story-locale.js quote-locales.js quote-locale-core.js quote-locale.js interface-locales.js interface-locale.js public/
          cp -r icons public/
          cp -r assets public/
          mkdir public/widget
          cp widget/Motive.js public/widget/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

