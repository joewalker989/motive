name: Deploy Motive to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check quotes.js
          node --test tests/quotes.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir public
          cp index.html styles.css app.js quotes.js icon.svg public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
