name: Motive
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_IDENTIFIER: group.com.joewalker989.motive
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Motive:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../quotes.json
        buildPhase: resources
      - path: ../assets/backgrounds
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joewalker989.motive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Motive
        INFOPLIST_KEY_MotiveAppGroup: $(APP_GROUP_IDENTIFIER)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your private Motive journal.
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [motive]
    entitlements:
      path: App/Motive.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    dependencies:
      - target: MotiveWidget
        embed: true
  MotiveWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: ../quotes.json
        buildPhase: resources
      - path: ../assets/backgrounds
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joewalker989.motive.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Motive Quotes
        INFOPLIST_KEY_MotiveAppGroup: $(APP_GROUP_IDENTIFIER)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MotiveWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
  MotiveWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - Watch
      - Shared/Quote.swift
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../quotes.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joewalker989.motive.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Motive
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        TARGETED_DEVICE_FAMILY: '4'
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
  MotiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Motive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joewalker989.motive.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MotiveWatch:
    build:
      targets:
        MotiveWatch: all
  Motive:
    build:
      targets:
        Motive: all
        MotiveTests: [test]
    test:
      targets: [MotiveTests]

